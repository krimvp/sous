<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-label="How sous works: you give a goal; leads split it; workers do the parts in parallel; a merge queue and checks verify the work; the result is a branch or folder. A supervisor of plain code runs every stage.">
